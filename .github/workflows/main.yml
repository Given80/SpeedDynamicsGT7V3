name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Verify project files
        shell: powershell
        run: |
          $required = @(
            "SpeedDynamicsGT7.py",
            "requirements.txt",
            "web\index.html",
            "web\speed_dynamics_logo.png",
            "web\car_silhouette.png",
            "web\gt7_mark.png"
          )
          foreach ($f in $required) {
            if (!(Test-Path $f)) { Write-Error "$f fehlt."; exit 1 }
          }
      - name: Build EXE
        shell: powershell
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name SpeedDynamicsGT7 --add-data "web;web" SpeedDynamicsGT7.py
      - name: Verify EXE
        shell: powershell
        run: |
          if (!(Test-Path "dist\SpeedDynamicsGT7.exe")) { Write-Error "EXE wurde nicht erstellt."; exit 1 }
          Get-Item "dist\SpeedDynamicsGT7.exe" | Format-List Name,Length,FullName
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SpeedDynamicsGT7-Windows
          path: dist/SpeedDynamicsGT7.exe
          if-no-files-found: error
          retention-days: 30
